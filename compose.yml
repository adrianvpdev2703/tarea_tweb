services:
  # Servidor Nginx como Proxy Inverso
  proxy:
    image: nginx:alpine
    container_name: nginx_proxy
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - pagina1
      - pagina2
      - pagina3
    networks:
      - web-network

  # Contenedor 1
  pagina1:
    build:
      context: ./pagina1
      dockerfile: dockerfile
    container_name: pagina1
    restart: unless-stopped
    networks:
      - web-network

  # Contenedor 2
  pagina2:
    build:
      context: ./pagina2
      dockerfile: dockerfile
    container_name: pagina2
    restart: unless-stopped
    networks:
      - web-network

  # Contenedor 3
  pagina3:
    build:
      context: ./pagina3
      dockerfile: dockerfile
    container_name: pagina3
    restart: unless-stopped
    networks:
      - web-network

networks:
  web-network:
    driver: bridge
