upstream mis_paginas {
    server pagina1:80;
    server pagina2:80;
    server pagina3:80;
}

server {
    listen 80;
    server_name localhost;

    # Proxy inverso principal en la raíz con balanceo de carga
    location / {
        proxy_pass http://mis_paginas;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Normalizar URLs sin barra inclinada
    location = /pagina1 { return 301 /pagina1/; }
    location = /pagina2 { return 301 /pagina2/; }
    location = /pagina3 { return 301 /pagina3/; }

    # Acceso directo por ruta a la Página 1
    location /pagina1/ {
        proxy_pass http://pagina1:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Acceso directo por ruta a la Página 2
    location /pagina2/ {
        proxy_pass http://pagina2:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Acceso directo por ruta a la Página 3
    location /pagina3/ {
        proxy_pass http://pagina3:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
