<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página 2 - Taller Web</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #064e3b, #022c22);
            color: #f8fafc;
            padding: 20px;
        }
        .container {
            background-color: #064e3b;
            border: 1px solid #10b981;
            border-radius: 16px;
            padding: 40px;
            max-width: 550px;
            width: 100%;
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5);
            text-align: center;
        }
        .tag {
            display: inline-block;
            background-color: #047857;
            color: #a7f3d0;
            padding: 6px 16px;
            border-radius: 9999px;
            font-size: 0.85rem;
            font-weight: 700;
            margin-bottom: 20px;
            text-transform: uppercase;
        }
        h1 { font-size: 2.2rem; margin-bottom: 15px; color: #34d399; }
        p { color: #d1fae5; line-height: 1.6; margin-bottom: 25px; }
        .nav {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 25px;
            flex-wrap: wrap;
        }
        .nav a {
            padding: 10px 18px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.2s ease;
        }
        .nav a.active {
            background-color: #10b981;
            color: white;
        }
        .nav a:not(.active) {
            background-color: #065f46;
            color: #a7f3d0;
        }
        .nav a:not(.active):hover {
            background-color: #047857;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <span class="tag">Contenedor: Pagina 2</span>
        <h1>Bienvenido a la Página 2</h1>
        <p>Este contenido proviene del contenedor <strong>pagina2</strong> y está siendo servido a través del proxy inverso Nginx.</p>

        <div class="nav">
            <a href="/pagina1/">Página 1</a>
            <a href="/pagina2/" class="active">Página 2</a>
            <a href="/pagina3/">Página 3</a>
        </div>
    </div>
</body>
</html>
